<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TV - Lista Completa</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --sidebar-bg: #111111;
            --accent: #6F32BD;
            --hover: #222;
            --active: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: white;
            display: flex;
            height: 100dvh;
            overflow: hidden; /* No scroll en el body entero */
        }

        /* SIDEBAR (Lista de canales a la izquierda) */
        .sidebar {
            width: 80px; /* Ancho pequeño como en la imagen, solo logos */
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
            z-index: 100;
            overflow-x: hidden;
            flex-shrink: 0;
            opacity: 1;
        }

        .sidebar.hidden-sidebar {
            width: 0 !important;
            border-right: none;
            opacity: 0;
            pointer-events: none;
        }

        /* Expande el sidebar al pasar el mouse (para ver nombres y buscador) */
        .sidebar:hover {
            width: 250px !important;
        }

        .sidebar-header {
            padding: 15px 10px;
            font-size: 13px;
            font-weight: bold;
            color: #ccc;
            text-align: center;
            border-bottom: 1px solid #333;
            letter-spacing: 1px;
            text-transform: uppercase;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Buscador integrado en el sidebar (oculto por defecto) */
        .search-container {
            padding: 10px;
            display: none; 
        }
        .sidebar:hover .search-container {
            display: block;
        }
        #search {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        .channel-list {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .channel-list::-webkit-scrollbar { width: 5px; }
        .channel-list::-webkit-scrollbar-track { background: var(--sidebar-bg); }
        .channel-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .canal {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1a;
            text-decoration: none;
            color: #eee;
            transition: background 0.2s;
        }

        .canal:hover, .canal.active, .canal:focus {
            background: var(--active);
            border-left: 3px solid var(--accent);
            padding-left: 7px;
            outline: none;
        }

        .logo-container {
            width: 50px;
            height: 35px;
            flex-shrink: 0;
            background: #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-right: 15px; 
            margin-left: 5px; /* Para que quede centrado en los 80px */
        }

        .logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .no-logo {
            font-size: 18px;
        }

        .name {
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .sidebar:hover .name {
            opacity: 1;
        }

        .hidden {
            display: none !important;
        }

        /* REPRODUCTOR (Área derecha) */
        .player-area {
            flex-grow: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            container-type: size;
            overflow: hidden;
        }

        #wake-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 100vh;
            z-index: 100000;
        }

        #tv-iframe {
            width: min(100cqw, (100cqh * 16) / 9);
            height: min(100cqh, (100cqw * 9) / 16);
            border: none;
            display: none; /* Oculto inicialmente */
        }

        .empty-state {
            color: #555;
            font-size: 18px;
            text-align: center;
            position: absolute;
        }
        /* ZAPPING CONTROLS (UNIVERSAL) */
        .zapping-controls {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 60px; /* Separación ampliada */
            z-index: 10001;
            padding: 20px; /* Area táctil generosa */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out; /* Fade out desintegrándose gradualmente */
        }

        .channel-nav-btn {
            background: rgba(10, 10, 10, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Botones grandes en Celular */
        html.is-mobile-device .channel-nav-btn {
            width: 60px;
            height: 90px;
        }
        html.is-mobile-device .channel-nav-btn svg { width: 34px; height: 34px; }
        
        /* Botones pequeños en TV */
        html.is-tv-desktop .channel-nav-btn {
            width: 40px;
            height: 60px;
        }
        html.is-tv-desktop .channel-nav-btn svg { width: 24px; height: 24px; }

        .channel-nav-btn:hover { 
            background: rgba(30, 30, 30, 0.8); 
            color: #ff3333; /* Color rojo de la referencia */
            transform: scale(1.05); 
            border-color: #ff3333; 
        }
        .channel-nav-btn:active { transform: scale(0.95); }

        .player-area.show-ui .zapping-controls {
            opacity: 1; pointer-events: auto;
        }
        /* ------------------------------------------------------------
           Carga de canales desde Pastebin
           ------------------------------------------------------------ */
        #boot-overlay {
            position: fixed;
            inset: 0;
            z-index: 15000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(10, 10, 10, 0.97);
        }
        .boot-card {
            width: min(560px, 100%);
            padding: 26px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #1b1b1b;
            color: #eee;
            text-align: center;
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.65);
        }
        .boot-card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }
        .boot-card p {
            margin: 8px 0;
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }
        .boot-spinner {
            width: 34px;
            height: 34px;
            margin: 0 auto 14px;
            border: 3px solid #333;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: bootspin 0.9s linear infinite;
        }
        @keyframes bootspin {
            to { transform: rotate(360deg); }
        }
        #boot-error {
            display: none;
            margin-top: 16px;
            text-align: left;
        }
        #boot-error input {
            box-sizing: border-box;
            width: 100%;
            margin: 8px 0 12px;
            padding: 10px 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #111;
            color: #fff;
            font-size: 14px;
        }
        #boot-error button {
            width: 100%;
            padding: 11px 16px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        #boot-error button:hover {
            filter: brightness(1.12);
        }

    </style>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
</head>

<body>

    <!-- Overlay de carga de canales desde Pastebin -->
    <div id="boot-overlay">
        <div class="boot-card">
            <div class="boot-spinner" id="boot-spinner"></div>
            <h2 id="boot-title">Cargando canales…</h2>
            <p id="boot-msg">Conectando con Pastebin…</p>
            <div id="boot-error">
                <p id="boot-error-msg"></p>
                <input id="boot-paste-input" type="text" placeholder="ID o enlace del paste (ej: AbC123...)" autocomplete="off">
                <button id="boot-retry">Cargar canales</button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">Canales</div>
        <div class="search-container">
            <input type="text" id="search" placeholder="Buscar canal..." onkeyup="filtrar()">
        </div>
        <div id="channel-list" class="channel-list">
            <!-- Canales iterados dinámicamente -->
        </div>
    </div>

    <div class="player-area">
        <!-- ZONA IZQUIERDA PARA DESPERTAR EL SIDEBAR -->
        <div id="wake-zone"></div>
        
        <div class="zapping-controls">
            <button class="channel-nav-btn btn-prev" onclick="zapChannel(-1)" title="Canal Anterior">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
            </button>
            <button class="channel-nav-btn btn-next" onclick="zapChannel(1)" title="Siguiente Canal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
        </div>

        <div class="empty-state" id="empty-state">
            <span style="font-size: 40px; display: block; margin-bottom:15px;">📺</span>
            Selecciona un canal de la izquierda<br>para empezar a ver.
        </div>
        <iframe id="tv-iframe" allow="autoplay; audio; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        <div id="clappr-player" style="display: none; width: min(100cqw, (100cqh * 16) / 9); height: min(100cqh, (100cqw * 9) / 16); background: #000; position: absolute; z-index: 10;"></div>
    </div>

    <!-- PIN Modal -->
    <div id="pin-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:20000; justify-content:center; align-items:center; flex-direction:column;">
        <div style="background:#222; padding:30px; border-radius:10px; text-align:center; border: 1px solid #444;">
            <h3 style="margin-top:0; color:#fff;">Código Requerido</h3>
            <p style="color:#aaa; margin-bottom:20px;">Introduce el código para acceder a este canal:</p>
            <input type="password" id="pin-input" style="padding:10px; font-size:18px; width:150px; text-align:center; border-radius:5px; border:none; margin-bottom:20px; outline:none;">
            <br>
            <button id="pin-submit" style="padding:10px 20px; background:var(--accent); color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; margin-right:10px;">Aceptar</button>
            <button id="pin-cancel" style="padding:10px 20px; background:#444; color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px;">Cancelar</button>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN DEL PASTE
        // ------------------------------------------------------------
        // 1. Subí pastebin_data.js a https://pastebin.com (público, JavaScript).
        // 2. Copiá el ID del paste (lo que va después de pastebin.com/).
        // 3. Reemplazá PEGA_AQUI_TU_ID por ese ID.
        //
        // También podés abrir la página así, sin editar el archivo:
        //   index.html?paste=TU_ID
        //   index.html?data=https://otro-sitio.com/canales.js
        // ============================================================
        const PASTEBIN_ID = 'CnnXt5hD';

        // Los canales y sus claves se cargan desde Pastebin (window.__TV_DATA__).
        let canales = [];

        const listContainer = document.getElementById('channel-list');
        const iframe = document.getElementById('tv-iframe');
        const emptyState = document.getElementById('empty-state');
        const clapprContainer = document.getElementById('clappr-player');

        let playerObj = null;
        let adultosDesbloqueados = false;
        let pendingAdultCanal = null;
        let pendingAdultElement = null;

        const pinModal = document.getElementById('pin-modal');
        const pinInput = document.getElementById('pin-input');
        
        document.getElementById('pin-submit').onclick = () => {
            if (pinInput.value === pendingAdultCanal.pin) {
                adultosDesbloqueados = true;
                pinModal.style.display = 'none';
                
                if (pendingAdultCanal.unlockedName) {
                    pendingAdultElement.querySelector('.name').innerText = pendingAdultCanal.unlockedName;
                }
                if (pendingAdultCanal.unlockedIcon) {
                    const img = pendingAdultElement.querySelector('.logo');
                    if (img) img.src = pendingAdultCanal.unlockedIcon;
                }

                filtrar(); // Mostrar los canales adultos ocultos
                abrirCanalDirecto(pendingAdultElement, pendingAdultCanal);
            } else {
                alert("Código incorrecto.");
                pinInput.value = '';
            }
        };

        document.getElementById('pin-cancel').onclick = () => {
            pinModal.style.display = 'none';
            pinInput.value = '';
            pendingAdultCanal = null;
            pendingAdultElement = null;
            document.getElementById('search').focus();
        };

        // Modificar cargarCanales para ocultar canales adultos


        const isMobileDevice = /Android.*Mobile|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobileDevice) {
            document.documentElement.classList.add('is-mobile-device');
        } else {
            document.documentElement.classList.add('is-tv-desktop');
        }

        function cargarCanales() {
            canales.forEach(canal => {
                const a = document.createElement('a');
                a.className = 'canal';
                if (canal.isAdult) {
                    a.classList.add('hidden', 'adult-card');
                }
                a.href = '#'; // Permitir foco en Smart TV
                a.onclick = (e) => { e.preventDefault(); abrirCanal(a, canal); };

                let contenidoLogo = canal.i
                    ? `<img src="${canal.i}" class="logo" onerror="this.style.display='none'; this.nextSibling.style.display='flex'">`
                    : '';

                a.innerHTML = `
                    <div class="logo-container"${canal.logoBg ? ' style="background:' + canal.logoBg + '"' : ''}>
                        ${contenidoLogo}
                        <div class="no-logo" style="${canal.i ? 'display:none' : 'display:flex'}">�Y"�</div>
                    </div>
                    <div class="name">${canal.n}</div>
                `;
                listContainer.appendChild(a);
            });
        }

        function abrirCanal(element, canal) {
            if (canal.pin && !adultosDesbloqueados) {
                pendingAdultCanal = canal;
                pendingAdultElement = element;
                pinInput.value = '';
                pinModal.style.display = 'flex';
                setTimeout(() => pinInput.focus(), 100);
                return;
            }
            abrirCanalDirecto(element, canal);
        }

        // Resuelve la URL del reproductor sin anidar una base dentro de otra:
        //  - URL completa (full-online.xyz/cvatt.php, streamxhd, proxies, etc.): se usa tal cual.
        //  - prefijo "cv:": canal del CDN cvatt (se arma la URL de cvatt, nunca tok2).
        //  - id base64: recién ahí se usa la base de tok2.
        function resolverFuente(id) {
            let valor = String(id || '').trim();
            if (valor.startsWith('//')) valor = 'https:' + valor;
            if (/^https?:\/\//i.test(valor)) return valor;
            if (/^cv:/i.test(valor)) return 'https://full-online.xyz/cvatt.php?get=' + valor.slice(3);
            const anidado = valor.match(/tok2\.html\?get=([^&]+)/i);
            if (anidado) valor = anidado[1];
            return `https://bestleague.life/tok2.html?get=${valor}&start=true&autoplay=1&muted=0&muted=false&volume=100&lang=1`;
        }

        // Canales del CDN cvatt (HGTV, AMÉRICA SPORTS): se reproducen con la extensión
        // "MPD · M3U8 · IPTV Player" como reproductor propio, sin anidar full-online.xyz
        // dentro del iframe (ese anidado es lo que falla en Brave).
        const EXT_IPTV = 'opmeopcambhfimffbomjgemehjkbbmji';
        const CVATT_HEADERS = 'eyJvcmlnaW4iOiJodHRwczovL3BvcnRhbC5hcHAuZmxvdy5jb20uYXIiLCJyZWZlcmVyIjoiaHR0cHM6Ly9wb3J0YWwuYXBwLmZsb3cuY29tLmFyLyJ9';
        let CVATT_CFG = {};

        // Canales que tok2 reproduce con la extensión: acá se abre el reproductor
        // directo (iframe con allow="autoplay"), así arrancan con sonido.
        // eds = carpeta cNeds del CDN; out = carpeta out/v1; keyId/key = ClearKey.
        let TOK2_CFG = {};

        let cvattTurno = 0;
        let cvattBase = null;

        // La extensión expone este ícono cuando está instalada y activa.
        function extensionIptvInstalada(cb) {
            const img = new Image();
            let listo = false;
            const fin = (ok) => { if (!listo) { listo = true; cb(ok); } };
            img.onload = () => fin(true);
            img.onerror = () => fin(false);
            setTimeout(() => fin(false), 1500);
            img.src = `chrome-extension://${EXT_IPTV}/play-on.png`;
        }

        // Un token cvatt sirve mientras su JWT no expire (suele durar ~2 días).
        function tokenCvattVigente(base) {
            try {
                const m = String(base).match(/tok_([A-Za-z0-9_.-]+)/);
                if (!m) return false;
                const partes = m[1].split('.');
                if (partes.length < 2) return false;
                const b64 = partes[1].replace(/-/g, '+').replace(/_/g, '/');
                const json = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
                return Number(JSON.parse(json).exp) * 1000 > Date.now() + 60000;
            } catch (e) {
                return false;
            }
        }

        // Token temporal del CDN cvatt. Se guarda en localStorage porque, una vez que la
        // extensión reproduce en esta pestaña, ella misma bloquea este pedido (403).
        function tokenCvatt() {
            if (cvattBase && tokenCvattVigente(cvattBase)) return Promise.resolve(cvattBase);
            try {
                const guardado = JSON.parse(localStorage.getItem('cvatt_base') || 'null');
                if (guardado && guardado.base && tokenCvattVigente(guardado.base)) {
                    cvattBase = guardado.base;
                    return Promise.resolve(cvattBase);
                }
            } catch (e) {}
            return fetch('https://chromecast.cvattv.com.ar/live/c6eds/TelefeHD/SA_Live_dash_cenc/TelefeHD.mpd', { cache: 'no-store' })
                .then((r) => {
                    const m = r.url.match(/(https:\/\/.+?)(?=\/live)/);
                    if (!m) return null;
                    cvattBase = m[1];
                    try { localStorage.setItem('cvatt_base', JSON.stringify({ base: cvattBase, ts: Date.now() })); } catch (e) {}
                    return cvattBase;
                })
                .catch(() => null);
        }

        function abrirCanalCvatt(id, urlOriginal) {
            const cfg = CVATT_CFG[id];
            const turno = ++cvattTurno;
            extensionIptvInstalada((instalada) => {
                if (turno !== cvattTurno) return;
                // Sin extensión: el reproductor de full-online muestra el aviso y el botón de instalación.
                if (!instalada) {
                    iframe.style.display = 'block';
                    iframe.src = urlOriginal;
                    return;
                }
                tokenCvatt().then((base) => {
                    if (turno !== cvattTurno) return;
                    if (!base) {
                        iframe.style.display = 'block';
                        iframe.src = urlOriginal;
                        return;
                    }
                    const mpd = `${base}/live/c${cfg.eds}eds/${cfg.canal}/SA_Live_dash_enc/${cfg.canal}.mpd`;
                    iframe.style.display = 'block';
                    iframe.src = `chrome-extension://${EXT_IPTV}/pages/player.html#${mpd}?ck=${encodeURIComponent(cfg.ck)}&headers=${CVATT_HEADERS}`;
                });
            });
        }

        // Igual que los canales cvatt, pero con la ruta y el ClearKey de tok2.
        // El iframe del reproductor tiene allow="autoplay", por eso arranca sin mute.
        function abrirCanalTok2(id, urlOriginal) {
            const cfg = TOK2_CFG[id];
            const turno = ++cvattTurno;
            extensionIptvInstalada((instalada) => {
                if (turno !== cvattTurno) return;
                // Sin extensión: tok2 muestra el aviso y el botón de instalación.
                if (!instalada || !cfg) {
                    iframe.style.display = 'block';
                    iframe.src = urlOriginal;
                    return;
                }
                tokenCvatt().then((base) => {
                    if (turno !== cvattTurno) return;
                    if (!base) {
                        iframe.style.display = 'block';
                        iframe.src = urlOriginal;
                        return;
                    }
                    const relleno = '='.repeat((4 - (id.length % 4)) % 4);
                    const canal = atob(id + relleno);
                    const ruta = cfg.out ? 'out/v1' : `live/c${cfg.eds}eds`;
                    const mpd = `${base}/${ruta}/${canal}/SA_Live_dash_enc/${canal}.mpd`;
                    const ck = btoa(`"${cfg.keyId}":"${cfg.key}"`);
                    iframe.style.display = 'block';
                    iframe.src = `chrome-extension://${EXT_IPTV}/pages/player.html#${mpd}?ck=${encodeURIComponent(ck)}&headers=${CVATT_HEADERS}`;
                });
            });
        }

        function abrirCanalDirecto(element, canal) {
            const canalId = canal.g;
            // Remover estado activo de todos
            document.querySelectorAll('.canal').forEach(c => c.classList.remove('active'));
            // Marcar el actual como activo
            element.classList.add('active');

            // Quitar el cartel de "Selecciona un canal"
            emptyState.style.display = 'none';
            
            if (playerObj) {
                playerObj.destroy();
                playerObj = null;
            }

            const cvattId = (String(canalId).match(/cvatt\.php\?get=([^&]+)/i) || [])[1];
            if (cvattId && CVATT_CFG[cvattId]) {
    clapprContainer.style.display = 'none';
    clapprContainer.innerHTML = '';
    iframe.removeAttribute('sandbox');
    abrirCanalCvatt(cvattId, canalId);
} else if (TOK2_CFG[(String(canalId).match(/tok2\.html\?get=([^&]+)/i) || [])[1] || canalId]) {
    clapprContainer.style.display = 'none';
    clapprContainer.innerHTML = '';
    iframe.removeAttribute('sandbox');
    abrirCanalTok2((String(canalId).match(/tok2\.html\?get=([^&]+)/i) || [])[1] || canalId, resolverFuente(canalId));
} else if (canalId.startsWith('http') && canalId.includes('.m3u8')) {
    clapprContainer.style.display = 'block';
    iframe.style.display = 'none';
    iframe.src = "";
    playerObj = new Clappr.Player({
        source: canalId,
        parentId: "#clappr-player",
        width: '100%',
        height: '100%',
        autoPlay: true,
        mute: false, // Forzamos a que NO se inicie muteado en Clappr
        volume: 100, // Forzamos el volumen al máximo
        hideVolumeBar: true
    });
} else {
    clapprContainer.style.display = 'none';
    clapprContainer.innerHTML = '';
    iframe.style.display = 'block';
    // Si el canal trae una URL propia se abre directo (ej: un reproductor externo)
    // Los ids base64 usan el reproductor directo de tok2 (c3/c4/c6/c7eds) para arrancar con sonido
    // Reproductores externos que inyectan publicidad emergente: se aíslan en un sandbox
    // sin allow-popups ni allow-top-navigation para que no abran pestañas nuevas.
    if (/streamxhd|streamtp99a|streamx723|la18hd|latamplay|m6foot|embed\.ksd/i.test(canalId)) {
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
    } else {
        iframe.removeAttribute('sandbox');
    }
    iframe.src = resolverFuente(canalId);
}

            // Solicitar fullscreen y apaisado si es móvil (para mayor inmersión), manteniendo el sidebar a la izquierda
            if (isMobileDevice) {
                try {
                    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().then(() => {
                            if (window.screen.orientation && window.screen.orientation.lock) {
                                window.screen.orientation.lock('landscape').catch(e => console.log("Locked orientation error:", e));
                            }
                        }).catch(e => console.log("Fullscreen error:", e));
                    }
                } catch(e) {}
            }
            
            showPlayerUI();
            document.body.classList.add('playing');
        }

        function filtrar() {
            const text = document.getElementById('search').value.toLowerCase();
            const cards = document.querySelectorAll('.canal');
            cards.forEach(card => {
                if (card.classList.contains('adult-card') && !adultosDesbloqueados) {
                    card.classList.add('hidden');
                    return;
                }
                const name = card.querySelector('.name').innerText.toLowerCase();
                if (name.includes(text)) card.classList.remove('hidden');
                else card.classList.add('hidden');
            });
        }

        // ------------------------------------------------------------
        // CARGA REMOTA DE CANALES (PASTEBIN)
        // ------------------------------------------------------------
        function normalizarPaste(valor) {
            const v = String(valor || '').trim();
            if (!v) return null;
            if (/^https?:\/\//i.test(v)) {
                const m = v.match(/pastebin\.com\/(?:raw\/|dl\/)?([A-Za-z0-9]+)/i);
                return m ? `https://pastebin.com/dl/${m[1]}` : v;
            }
            if (/^[A-Za-z0-9]+$/.test(v)) return `https://pastebin.com/dl/${v}`;
            return null;
        }

        function urlDatos() {
            const params = new URLSearchParams(location.search);
            const data = params.get('data');
            if (data) return data;
            return normalizarPaste(params.get('paste') || PASTEBIN_ID);
        }

        function cargarScriptDatos(url) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now();
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('No se pudo descargar el archivo de canales. Verificá que el paste sea público y que el ID/enlace sea correcto.'));
                document.head.appendChild(s);
                setTimeout(() => reject(new Error('La descarga de los canales tardó demasiado. Revisá tu conexión o el enlace del paste.')), 20000);
            });
        }

        function mostrarErrorCarga(mensaje) {
            document.getElementById('boot-overlay').style.display = 'flex';
            document.getElementById('boot-spinner').style.display = 'none';
            document.getElementById('boot-title').textContent = 'No se pudieron cargar los canales';
            document.getElementById('boot-msg').textContent = '';
            document.getElementById('boot-error').style.display = 'block';
            document.getElementById('boot-error-msg').textContent = mensaje;
            document.getElementById('boot-paste-input').focus();
        }

        async function iniciarApp() {
            const url = urlDatos();
            if (!url) {
                mostrarErrorCarga('Falta configurar el ID de Pastebin. Subí pastebin_data.js como paste público y pegá acá el ID (o la URL).');
                return;
            }
            try {
                await cargarScriptDatos(url);
                const datos = window.__TV_DATA__;
                if (!datos || !Array.isArray(datos.canales) || datos.canales.length === 0) {
                    throw new Error('El paste no contiene datos válidos (window.__TV_DATA__.canales).');
                }
                canales = datos.canales;
                CVATT_CFG = datos.CVATT_CFG || {};
                TOK2_CFG = datos.TOK2_CFG || {};
                cargarCanales();
                document.getElementById('boot-overlay').style.display = 'none';
            } catch (e) {
                console.error('Error cargando canales:', e);
                mostrarErrorCarga(e.message || 'Error desconocido al cargar los canales.');
            }
        }

        document.getElementById('boot-retry').onclick = () => {
            const valor = document.getElementById('boot-paste-input').value.trim();
            if (!valor) {
                document.getElementById('boot-paste-input').focus();
                return;
            }
            const url = new URL(location.href);
            url.searchParams.delete('data');
            url.searchParams.set('paste', valor);
            location.href = url.toString();
        };
        document.getElementById('boot-paste-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('boot-retry').click();
        });

        iniciarApp();

        // Precarga el token del CDN cvatt/tok2 antes de que la extensión empiece a reproducir
        // (después de eso, la propia extensión bloquea el pedido en esta pestaña).
        extensionIptvInstalada((ok) => { if (ok) tokenCvatt(); });

        // ----------------------------------------------------
        // L�"GICA DE INTERFAZ & SIDEBAR
        // ----------------------------------------------------
        let sidebarTimer;
        let isHoveringSidebar = false;
        const sidebarEl = document.querySelector('.sidebar');
        
        sidebarEl.addEventListener('mouseenter', () => isHoveringSidebar = true);
        sidebarEl.addEventListener('mouseleave', () => {
            isHoveringSidebar = false;
            resetSidebarTimer();
        });

        function resetSidebarTimer() {
            sidebarEl.classList.remove('hidden-sidebar');
            clearTimeout(sidebarTimer);
            if (!isHoveringSidebar) {
                sidebarTimer = setTimeout(() => {
                    sidebarEl.classList.add('hidden-sidebar');
                }, 5000);
            }
        }

        // Lógica de UI del reproductor (desaparecer Overlay buttons)
        let playerUiTimer;
        const playerArea = document.querySelector('.player-area');
        
        function showPlayerUI() {
            if(!document.body.classList.contains('playing') && !document.documentElement.classList.contains('is-tv-desktop')) return;
            playerArea.classList.add('show-ui');
            
            clearTimeout(playerUiTimer);
            playerUiTimer = setTimeout(() => {
                playerArea.classList.remove('show-ui');
            }, 4000); // Se ocultan después de 4s en todos los dispositivos
        }

        playerArea.addEventListener('mousemove', showPlayerUI);
        playerArea.addEventListener('touchstart', showPlayerUI);
        playerArea.addEventListener('click', showPlayerUI);

        // Cualquier movimiento resetea el timer de la lista
        document.addEventListener('mousemove', resetSidebarTimer);
        document.addEventListener('touchstart', resetSidebarTimer);
        
        resetSidebarTimer();

        // ----------------------------------------------------
        // L�"GICA DE ZAPPING OVERLAY
        // ----------------------------------------------------
        function getVisibleChannels() {
            return Array.from(document.querySelectorAll('.canal:not(.hidden)'));
        }

        function zapChannel(direction) {
            const visibles = getVisibleChannels();
            if (visibles.length === 0) return;
            const actIdx = visibles.findIndex(c => c.classList.contains('active'));
            let newIdx = 0;
            if (direction === 1) { // next (derecha, abajo)
                newIdx = (actIdx === -1 || actIdx === visibles.length - 1) ? 0 : actIdx + 1;
            } else { // prev (izquierda, arriba)
                newIdx = (actIdx === -1 || actIdx === 0) ? visibles.length - 1 : actIdx - 1;
            }
            const canalSelec = visibles[newIdx];
            canalSelec.click();
            canalSelec.scrollIntoView({ behavior: 'smooth', block: 'center' });
            showPlayerUI();
            resetSidebarTimer();
        }

        // ----------------------------------------------------
        // L�"GICA DE TECLADO / SMART TV REMOTE
        // ----------------------------------------------------
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.id === 'search') return;

            const isPlaying = document.body.classList.contains('playing');

            // Detener el reproductor y volver al estado vacío
            if (e.key === 'Escape' || e.key === 'Backspace') {
                e.preventDefault();
                if (pinModal.style.display === 'flex') {
                    document.getElementById('pin-cancel').click();
                    return;
                }
                document.body.classList.remove('playing');
                iframe.src = "";
                if(playerObj) { playerObj.destroy(); playerObj = null; }
                emptyState.style.display = 'block';
                iframe.style.display = 'none';
                clapprContainer.style.display = 'none';
                document.querySelectorAll('.canal').forEach(c => c.classList.remove('active'));
                document.getElementById('search').focus();
                return;
            }

            // Enter: Activar canal si estamos en la lista o mostrar UI si reproducimos
            if (e.key === 'Enter') {
                e.preventDefault();
                if (isPlaying) {
                    showPlayerUI();
                } else {
                    if (document.activeElement && document.activeElement.classList.contains('canal')) {
                        document.activeElement.click();
                    }
                }
                return;
            }

            // Navegación (Zapping / Foco)
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === '+' || e.key === '-') {
                e.preventDefault();
                
                if (isPlaying) {
                    // Si estamos reproduciendo, Arriba/Derecha/+ cambian al siguiente. Abajo/Izquierda/- al anterior.
                    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === '-') {
                        zapChannel(-1);
                    } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === '+') {
                        zapChannel(1);
                    }
                } else {
                    // Si estamos en la lista, mover el foco para Smart TV.
                    const visibles = getVisibleChannels();
                    let actIdx = visibles.findIndex(c => c === document.activeElement);
                    if (actIdx === -1) actIdx = visibles.findIndex(c => c.classList.contains('active'));

                    let newIdx = actIdx;
                    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === '+') {
                        newIdx = (actIdx === -1 || actIdx === visibles.length - 1) ? 0 : actIdx + 1;
                    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === '-') {
                        newIdx = (actIdx === -1 || actIdx === 0) ? visibles.length - 1 : actIdx - 1;
                    }

                    const canalSelec = visibles[newIdx];
                    canalSelec.focus();
                    canalSelec.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    resetSidebarTimer();
                }
            }
        });
    </script>
